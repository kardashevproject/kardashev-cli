name: CI & OpenCommons Verification Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Ruff, Pytest & OpenCommons 5-Gate Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check src tests benchmarks

      - name: Run Pytest Suite
        run: pytest -v

      - name: Run OpenCommons 5-Gate Empirical Verification
        run: python benchmarks/evaluate_opencommons.py --store commons/store.json
