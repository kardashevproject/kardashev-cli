[project]
name = "kardashev-cli"
version = "0.2.0"
description = "Kardashev CLI (kardashev / ksh): Autonomous scientific & systems coding agent studio with AST Repo-Map, Self-Healing Edits, and Distributed OpenCommons CRDT Research."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "The Kardashev Project", email = "opensource@kardashevproject.org" },
]
keywords = [
    "kardashev",
    "opencommons",
    "ai-agents",
    "litert",
    "gemma",
    "glm-4",
    "qwen",
    "vllm",
    "ollama",
    "local-llm",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "google-antigravity>=0.1.22",
    "prompt-toolkit>=3.0.40",
    "pydantic>=2.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
litert = [
    "litert-lm>=0.18.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/kardashevproject/kardashev-cli"
Repository = "https://github.com/kardashevproject/kardashev-cli"
Issues = "https://github.com/kardashevproject/kardashev-cli/issues"
Changelog = "https://github.com/kardashevproject/kardashev-cli/blob/main/CHANGELOG.md"

[project.scripts]
kardashev = "kardashev_cli.cli:main"
ksh = "kardashev_cli.cli:main"
kardashev-mcp = "kardashev_cli.mcp_server:main"
opencommons-mcp = "kardashev_cli.opencommons:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kardashev_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 105
target-version = "py310"
